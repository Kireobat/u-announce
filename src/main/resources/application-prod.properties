# Production settings
spring.docker.compose.enabled=false

# Production database (from environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USER}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Production environment URLs
environment.frontend.path=${FRONTEND_SERVER_URL}
environment.api.path=${BACKEND_SERVER_URL}

# SpringDoc OpenAPI/Swagger configuration
springdoc.swagger-ui.oauth.client-id=${FRONTEND_KEYCLOAK_CLIENT_ID}

# Keycloak admin client configuration
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL}
keycloak.admin.realm=${KEYCLOAK_REALM}
keycloak.admin.client-id=${BACKEND_KEYCLOAK_CLIENT_ID}
keycloak.admin.client-secret=${BACKEND_KEYCLOAK_CLIENT_SECRET}

# MinIO configuration
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}

# uAnnounce
u-announce.security.master-key=${MASTER_KEY}