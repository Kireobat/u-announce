# Production settings
spring.docker.compose.enabled=false

# Production database (from environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USER}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Production environment URLs
environment.frontend.path=https://u-announce.kireobat.eu
environment.api.path=https://api.kireobat.eu

# SpringDoc OpenAPI/Swagger configuration
springdoc.swagger-ui.oauth.client-id=uannounce-swagger-ui

# Keycloak admin client configuration
keycloak.admin.server-url=https://keycloak.kireobat.eu
keycloak.admin.realm=u-announce
keycloak.admin.client-id=${U_ANNOUNCE_KEYCLOAK_CLIENT_ID}
keycloak.admin.client-secret=${U_ANNOUNCE_KEYCLOAK_CLIENT_SECRET}

# uAnnounce
u-announce.security.master-key=${U_ANNOUNCE_MASTER_KEY}