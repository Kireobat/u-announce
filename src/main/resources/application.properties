# Spring profile
spring.profiles.active=@activatedProperties@

# Basic properties
server.port=8080
spring.application.name=u-announce
server.servlet.context-path=/${spring.application.name}
server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
spring.data.rest.defaultMediaType=application/json
server.error.include-message=always

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=u_announce
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=15000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (common settings)
spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration
spring.flyway.schemas=u_announce
spring.flyway.table=U_ANNOUNCE_SCHEMA_VERSION
spring.flyway.baseline-on-migrate=true

# SpringDoc OpenAPI/Swagger configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true