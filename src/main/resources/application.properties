# Spring profile
spring.profiles.active=@activatedProperties@

# Basic properties
server.port=8080
spring.application.name=u-announce
server.servlet.context-path=/${spring.application.name}
server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
spring.data.rest.defaultMediaType=application/json
server.error.include-message=always

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=${spring.flyway.schemas}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=15000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (common settings)
spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration
spring.flyway.schemas=u_announce
spring.flyway.table=U_ANNOUNCE_SCHEMA_VERSION
spring.flyway.baseline-on-migrate=true

# Keycloak admin client configuration
keycloak.admin.server-url=https://keycloak.kireobat.eu
keycloak.admin.realm=uAnnounce
keycloak.admin.client-id=${U_ANNOUNCE_KEYCLOAK_CLIENT_ID}
keycloak.admin.client-secret=${U_ANNOUNCE_KEYCLOAK_CLIENT_SECRET}

# SpringDoc OpenAPI/Swagger configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/index.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.oauth.client-id=uannounce-swagger-ui
springdoc.swagger-ui.oauth.realm=${keycloak.admin.realm}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.admin.server-url}/realms/${keycloak.admin.realm}

# Required roles
roles.org-admin=org_admin